<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Second-Hand Marketplace</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{background:#f4f4f4}

/* Navbar */
.navbar{
    background:#2c3e50;
    color:#fff;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.navbar a{
    color:#fff;
    margin-left:20px;
    text-decoration:none;
}
.navbar a:hover{text-decoration:underline}

/* Search */
.search-box{
    text-align:center;
    margin:20px;
}
.search-box input{
    width:50%;
    padding:10px;
    font-size:16px;
}

/* Products */
.products{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}
.card{
    background:#fff;
    padding:15px;
    border-radius:8px;
    text-align:center;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}
.card img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:6px;
}
.card h3{margin:10px 0}
.card p{color:green;font-weight:bold}
.card button{
    margin-top:10px;
    padding:8px 12px;
    border:none;
    background:#27ae60;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}
.card button:hover{background:#219150}

/* Sections */
section{padding:20px}
#cartSection{display:none}

.cart-item{
    background:#fff;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
}

footer{
    background:#2c3e50;
    color:#fff;
    text-align:center;
    padding:10px;
    margin-top:30px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>ReSell Hub</h2>
    <div>
        <a href="#" onclick="showHome()">Home</a>
        <a href="#" onclick="showProducts()">Products</a>
        <a href="#" onclick="showCart()">Cart (<span id="cartCount">0</span>)</a>
    </div>
</div>

<!-- SEARCH BAR -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProduct()">
</div>

<!-- HOME -->
<section id="homeSection">
    <h2>Buy & Sell Second-Hand Products</h2>
    <p>Affordable • Reusable • Sustainable</p>

    <div class="products" id="homeProducts">
        <!-- Products shown on home -->
    </div>
</section>

<!-- PRODUCTS PAGE -->
<section id="productSection" style="display:none;">
    <h2>All Products</h2>
    <div class="products" id="productList">
        <!-- Same products shown here -->
    </div>
</section>

<!-- CART -->
<section id="cartSection">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
</section>

<footer>
    © 2025 ReSell Hub | Second-Hand E-commerce Project
</footer>

<script>
let cart=[];
let products=[
    {name:"Laptop", price:"₹25,000"},
    {name:"Mobile", price:"₹8,500"},
    {name:"Study Table", price:"₹4,200"},
    {name:"Headphones", price:"₹1,200"}
];

/* Load products */
function loadProducts(){
    let home=document.getElementById("homeProducts");
    let list=document.getElementById("productList");
    home.innerHTML=list.innerHTML="";

    products.forEach(p=>{
        let card=`
        <div class="card" data-name="${p.name}">
            <img src="https://via.placeholder.com/300">
            <h3>${p.name}</h3>
            <p>${p.price}</p>
            <button onclick="addToCart('${p.name} - ${p.price}')">Add to Cart</button>
        </div>`;
        home.innerHTML+=card;
        list.innerHTML+=card;
    });
}
loadProducts();

/* Navigation */
function showHome(){
    document.getElementById("homeSection").style.display="block";
    document.getElementById("productSection").style.display="none";
    document.getElementById("cartSection").style.display="none";
}
function showProducts(){
    document.getElementById("homeSection").style.display="none";
    document.getElementById("productSection").style.display="block";
    document.getElementById("cartSection").style.display="none";
}
function showCart(){
    document.getElementById("homeSection").style.display="none";
    document.getElementById("productSection").style.display="none";
    document.getElementById("cartSection").style.display="block";
    displayCart();
}

/* Cart */
function addToCart(item){
    cart.push(item);
    document.getElementById("cartCount").innerText=cart.length;
    alert("Added to cart");
}
function displayCart(){
    let div=document.getElementById("cartItems");
    div.innerHTML="";
    if(cart.length==0){
        div.innerHTML="<p>Cart is empty</p>";
        return;
    }
    cart.forEach((item,i)=>{
        div.innerHTML+=`<div class="cart-item">${i+1}. ${item}</div>`;
    });
}

/* Search */
function searchProduct(){
    let input=document.getElementById("searchInput").value.toLowerCase();
    let cards=document.querySelectorAll(".card");
    cards.forEach(c=>{
        let name=c.getAttribute("data-name").toLowerCase();
        c.style.display=name.includes(input)?"block":"none";
    });
}
</script>

</body>
</html>
