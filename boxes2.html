<!DOCTYPE html>
<html>
<head>
  <title>Inline Elements Centered</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 50px;">

  <h2 style="text-align:center; margin-bottom:40px;">Major Versions of HTML</h2>

  <!-- Inline container centered -->
  <div style="width: 600px; margin: 0 auto; border: 2px solid orange; border-radius: 12px; padding: 20px;">

    <!-- Inline boxes in a row, centered -->
    <div style="display: flex; justify-content: center; gap: 20px;">

      <div style="background: #ffe7c1; padding: 18px 35px; border: 2px solid orange; border-radius: 10px; text-align: center;">
        Box 1
      </div>
      <div style="background: #ffe7c1; padding: 18px 35px; border: 2px solid orange; border-radius: 10px; text-align: center;">
        Box 2
      </div>
      <div style="background: #ffe7c1; padding: 18px 35px; border: 2px solid orange; border-radius: 10px; text-align: center;">
        Box 3
      </div>
      <div style="background: #ffe7c1; padding: 18px 35px; border: 2px solid orange; border-radius: 10px; text-align: center;">
        Box 4
      </div>

    </div>
  </div>

  <!-- Label centered below the orange box -->
  <p style="text-align:center; font-weight: bold; margin-top: 15px;">Inline Element</p>

</body>
</html>
